[package]
name = "snapline"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
global-hotkey = "0.9.0"
keyring-core = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
snapline-core = { path = "../snapline-core" }
snapline-overlay = { path = "../snapline-overlay" }
snapline-upload = { version = "0.1.0", path = "../snapline-upload" }
softbuffer = "0.4.8"
toml = "1.1.8"
tray-icon = "0.26.1"
winit = "0.30.13"
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
snapline-upload = { path = "../snapline-upload", features = ["fake"] }

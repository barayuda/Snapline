name: windows-linux

on:
  push:
    paths: ["windows-linux/**", "fixtures/**", "Assets/icon-1024.png", ".github/workflows/windows-linux.yml"]
  pull_request:
    paths: ["windows-linux/**", "fixtures/**", "Assets/icon-1024.png", ".github/workflows/windows-linux.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows-linux
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install   # the toolchain named in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-linux
      - run: cargo fmt --check
      # The app is Windows-only until Phase 6; Linux checks the shared crates.
      - name: Lint and test (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --exclude snapline --all-targets -- -D warnings
          cargo test --workspace --exclude snapline
      - name: Lint and test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build snapline.exe
        if: runner.os == 'Windows'
        run: cargo build --release -p snapline
      - name: Check the exe's version info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = (cargo pkgid -p snapline) -replace '.*[#@]', ''
          $info = (Get-Item target/release/snapline.exe).VersionInfo
          "ProductVersion=$($info.ProductVersion) ProductName=$($info.ProductName) want=$want"
          if ($info.ProductVersion -ne $want -or $info.ProductName -ne 'Snapline') { exit 1 }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: snapline-windows
          path: windows-linux/target/release/snapline.exe
          if-no-files-found: error
      - name: Build the installer, zip and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/package.ps1 -Version ((cargo pkgid -p snapline) -replace '.*[#@]', '')
      - name: Install, check and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\dist\Snapline-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=startup' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Snapline\snapline.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Snapline
          if ($run -ne "`"$exe`"") { throw "Run value is '$run'" }
          $uninstall = "$env:LOCALAPPDATA\Programs\Snapline\unins000.exe"
          Start-Process $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "still installed" }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Snapline) { throw "Run value left" }
          "install, sign-in entry and uninstall: ok"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: snapline-windows-dist
          path: windows-linux/target/dist/*
          if-no-files-found: error

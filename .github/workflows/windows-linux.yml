name: windows-linux

on:
  push:
    paths: ["windows-linux/**", "fixtures/**", ".github/workflows/windows-linux.yml"]
  pull_request:
    paths: ["windows-linux/**", "fixtures/**", ".github/workflows/windows-linux.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows-linux
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install   # the toolchain named in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-linux
      - run: cargo fmt --check
      # The app is Windows-only until Phase 6; Linux checks the shared crates.
      - name: Lint and test (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --exclude snapline --all-targets -- -D warnings
          cargo test --workspace --exclude snapline
      # Windows Server images have the OCR API but may lack its English data; the OCR test needs it.
      - name: English text recognition (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*" | Format-Table Name, State
          Get-WindowsCapability -Online -Name "Language.OCR~~~en-US*" | Where-Object State -ne Installed | Add-WindowsCapability -Online
          Get-WindowsCapability -Online -Name "Language.OCR~~~en-US*" | Format-Table Name, State
      - name: Lint and test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build snapline.exe
        if: runner.os == 'Windows'
        run: cargo build --release -p snapline
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: snapline-windows
          path: windows-linux/target/release/snapline.exe
          if-no-files-found: error

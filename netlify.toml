# The website lives in site/. Building from there keeps Netlify away from the app projects
# (it would see Package.swift and try to install Swift; nothing here needs building).
[build]
  base = "site"
  publish = "/"   # relative to base, so this is site/ itself
  # Only the website branch deploys and every push to it is deliberate, so always deploy.
  # (Without this, Netlify skips builds when it thinks site/ did not change.)
  ignore = "exit 1"

# One public address: send the Netlify subdomain to the custom domain, keeping the path.
# Deploy permalinks (<id>--snapline-app.netlify.app) are other hosts, so they still work for checking a deploy.
[[redirects]]
  from = "https://snapline-app.netlify.app/*"
  to = "https://snapline.barayuda.web.id/:splat"
  status = 301
  force = true

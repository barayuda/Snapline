# The website lives in site/. Building from there keeps Netlify from seeing Package.swift
# and trying to install Swift (it would fail, and nothing here needs building).
[build]
  base = "site"
  publish = "/"   # relative to base, so this is site/ itself
  # Only the website branch deploys and every push to it is deliberate, so always deploy.
  # (Without this, Netlify skips builds when it thinks site/ did not change.)
  ignore = "exit 1"
